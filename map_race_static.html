<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Winter Lake Park — Final Release</title>
  <style>
    :root {
      --green: #19a35c;
      --green-dark: #117f46;
      --red: #e53935;
      --dark: #0d1f26;
      --shadow: rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #e6edf0;
      font-family: Arial, "Noto Sans Hebrew", sans-serif;
      color: white;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: linear-gradient(180deg, #dce6eb 0%, #c7d4da 100%);
    }

    .frame {
      position: relative;
      width: min(100%, 980px);
      aspect-ratio: 1.36;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.18);
      border: 3px solid rgba(255,255,255,.45);
      background: #dfece3 url('./winter_pond_map.jpg') center/cover no-repeat;
    }

    .info-tag {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(14, 33, 39, 0.72);
      border: 2px solid rgba(255,255,255,0.5);
      backdrop-filter: blur(3px);
      border-radius: 999px;
      padding: 7px 12px 7px 10px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.2);
    }

    .info-tag span {
      display: inline-block;
      vertical-align: middle;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.2px;
    }

    .pin {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50% 50% 50% 0;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      transform: rotate(-45deg);
      box-shadow: 0 8px 18px rgba(0,0,0,0.22);
      border: 3px solid rgba(255,255,255,0.9);
    }

    .pin::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.92);
    }

    .pin-wrap {
      position: absolute;
      width: 26px;
      height: 26px;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      animation: pulse 1.5s infinite ease-in-out;
    }

    .pin-label {
      position: absolute;
      left: 53%;
      top: 57%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 108px;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.8);
      background: rgba(20, 31, 33, 0.8);
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .finish-pin {
      position: absolute;
      left: 39%;
      top: 58%;
      width: 26px;
      height: 26px;
      border-radius: 50% 50% 50% 0;
      background: linear-gradient(135deg, #ff4d4d, #c62828);
      transform: rotate(-45deg);
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
      border: 3px solid rgba(255,255,255,0.9);
      animation: finishPulse 1.4s infinite ease-in-out;
    }

    .finish-pin::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
    }

    .finish-label {
      position: absolute;
      left: 42%;
      top: 63%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 118px;
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.8);
      background: rgba(44, 19, 19, 0.78);
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .small-note {
      position: absolute;
      right: 18px;
      bottom: 18px;
      background: rgba(0,0,0,0.45);
      color: white;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.22); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.38); opacity: 0; }
    }

    @keyframes finishPulse {
      0% { transform: rotate(-45deg) scale(1); opacity: 1; }
      70% { transform: rotate(-45deg) scale(1.25); opacity: 0.85; }
      100% { transform: rotate(-45deg) scale(1.4); opacity: 0; }
    }

    @media (max-width: 700px) {
      .frame {
        width: 100%;
        aspect-ratio: 1 / 1.15;
      }
      .finish-label, .pin-label {
        min-width: 90px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="frame" aria-label="מפת שלולית החורף בנתניה">
      <div class="pin-wrap" aria-hidden="true">
        <div class="pin"></div>
      </div>
      <div class="pin-label">Final Release</div>

      <div class="finish-pin" aria-hidden="true"></div>
      <div class="finish-label">Final Release</div>

      <div class="small-note">Winter Lake Park • Final Release</div>
    </div>
  </div>
</body>
</html>
